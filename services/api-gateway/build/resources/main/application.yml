server:
  port: 8000

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # ---------------------------------------------------------------------
        # 1. Tenant Service
        # ---------------------------------------------------------------------
        - id: tenant-service
          uri: ${TENANT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/tenants/**

        # ---------------------------------------------------------------------
        # 2. Identity Service (Auth & Users)
        # ---------------------------------------------------------------------
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        # ---------------------------------------------------------------------
        # 3. Audit Service
        # ---------------------------------------------------------------------
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/audit/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: when_authorized
    gateway:
      enabled: true
