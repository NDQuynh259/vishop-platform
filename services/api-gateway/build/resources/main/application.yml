server:
  port: 8000

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # ---------------------------------------------------------------------
        # 1. Tenant Service
        # ---------------------------------------------------------------------
        - id: tenant-service
          uri: ${TENANT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/tenants/**

        # ---------------------------------------------------------------------
        # 2. Identity Service (Auth & Users)
        # ---------------------------------------------------------------------
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        # ---------------------------------------------------------------------
        # 3. Audit Service
        # ---------------------------------------------------------------------
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/audit/**

        # ---------------------------------------------------------------------
        # 4. OpenAPI / Swagger Documentation Aggregation
        # ---------------------------------------------------------------------
        - id: tenant-service-docs
          uri: ${TENANT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/v3/api-docs/tenant-service
          filters:
            - SetPath=/v3/api-docs

        - id: identity-service-docs
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/v3/api-docs/identity-service
          filters:
            - SetPath=/v3/api-docs

        - id: audit-service-docs
          uri: ${AUDIT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/v3/api-docs/audit-service
          filters:
            - SetPath=/v3/api-docs

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Tenant Service
        url: /v3/api-docs/tenant-service
      - name: Identity Service
        url: /v3/api-docs/identity-service
      - name: Audit Service
        url: /v3/api-docs/audit-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: W3C,B3
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

