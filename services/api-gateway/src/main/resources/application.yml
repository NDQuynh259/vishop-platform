server:
  port: 8000

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        # ---------------------------------------------------------------------
        # 1. Identity, tenants and CMS share IAM
        # ---------------------------------------------------------------------
        - id: iam-service
          uri: ${IAM_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/tenants/**,/api/v1/invitations/**,/api/v1/cms/**

        # ---------------------------------------------------------------------
        # 3. Audit Service
        # ---------------------------------------------------------------------
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/audit/**

        # ---------------------------------------------------------------------
        # 4. OpenAPI Specification Routing
        # ---------------------------------------------------------------------
        - id: iam-service-docs
          uri: ${IAM_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/v3/api-docs/iam-service
          filters:
            - SetPath=/v3/api-docs

        - id: audit-service-docs
          uri: ${AUDIT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/v3/api-docs/audit-service
          filters:
            - SetPath=/v3/api-docs

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    gateway:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: W3C,B3
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

vishop:
  security:
    jwt:
      secret: ${JWT_SECRET:vishop_platform_dev_jwt_secret_key_at_least_32_bytes_long!}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8000,http://127.0.0.1:8000,http://127.0.0.1:3000}
