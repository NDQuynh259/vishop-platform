spring.application.name=notification-service
spring.profiles.default=dev
vishop.env-file.service=notification-service
server.address=${NOTIFICATION_BIND_ADDRESS:127.0.0.1}
server.port=${NOTIFICATION_PORT:8084}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.data.redis.host=${AUTH_REDIS_HOST:localhost}
spring.data.redis.port=${AUTH_REDIS_PORT:6380}
spring.data.redis.password=${AUTH_REDIS_PASSWORD:}
spring.data.redis.database=${AUTH_REDIS_DATABASE:0}
vishop.cache.key-prefix=${CACHE_KEY_PREFIX:${AUTH_CACHE_PREFIX:vishop:}}
management.endpoints.web.exposure.include=health
