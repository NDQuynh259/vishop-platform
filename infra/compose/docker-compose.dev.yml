# =============================================================================
# ViShop Platform - Docker Compose for DEVELOPMENT
# =============================================================================
# Features:
# - Full stack: All infrastructure + 4 microservices runnable in 1 command
# - JDWP Remote Debugging ports enabled on 5000, 5001, 5002, 5003
# - 100% Distributed Tracing sampling rate (1.0)
# - All DB & Management UIs exposed to host (Kafka-UI, Jaeger, Grafana, Postgres)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 (Port 5432 exposed for DBeaver / DataGrip)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vishop-dev-postgres
    restart: on-failure
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vishop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vishop_secret}
      POSTGRES_DB: vishop_platform
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ../postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vishop -d vishop_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Apache Kafka (KRaft mode)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: vishop-dev-kafka
    restart: on-failure
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-dev-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. Kafka UI (Developer tool on http://localhost:8088)
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vishop-dev-kafka-ui
    restart: on-failure
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: dev-vishop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 4. Redis 7 (Port 6379 exposed for Redis Insight / CLI)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vishop-dev-redis
    restart: on-failure
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 5. Jaeger (Web UI on http://localhost:16686)
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: vishop-dev-jaeger
    restart: on-failure
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # ---------------------------------------------------------------------------
  # 6. Prometheus (Web UI on http://localhost:9090)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: vishop-dev-prometheus
    restart: on-failure
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-dev-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # 7. Grafana Loki & Grafana Dashboard (http://localhost:3000)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.0.0
    container_name: vishop-dev-loki
    restart: on-failure
    ports:
      - "3100:3100"
    volumes:
      - ../loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-dev-data:/loki

  grafana:
    image: grafana/grafana:10.4.1
    container_name: vishop-dev-grafana
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-dev-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
      - loki

  # ===========================================================================
  # MICROSERVICES (WITH JDWP REMOTE DEBUGGING)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 8. IAM Service (HTTP 8080, Debug 5001)
  # ---------------------------------------------------------------------------
  iam-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
      args:
        SERVICE_NAME: iam-service
        SERVICE_PORT: 8080
        DEBUG_PORT: 5001
    image: vishop/iam-service:dev
    container_name: vishop-dev-iam-service
    restart: on-failure
    ports:
      - "${IAM_PORT:-8080}:8080"
      - "${IAM_DEBUG_PORT:-5001}:5001"
    environment:
      SERVER_PORT: 8080
      IAM_INTERNAL_SECRET: ${IAM_INTERNAL_SECRET:?Set IAM_INTERNAL_SECRET to a random value of at least 32 bytes}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 bytes}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vishop_iam
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vishop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vishop_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: 1.0
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 9. Tenant Service (HTTP 8081, Debug 5002)
  # ---------------------------------------------------------------------------
  audit-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
      args:
        SERVICE_NAME: audit-service
        SERVICE_PORT: 8082
        DEBUG_PORT: 5003
    image: vishop/audit-service:dev
    container_name: vishop-dev-audit-service
    restart: on-failure
    ports:
      - "${AUDIT_PORT:-8082}:8082"
      - "${AUDIT_DEBUG_PORT:-5003}:5003"
    environment:
      SERVER_PORT: 8082
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 bytes}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vishop_audit
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vishop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vishop_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: 1.0
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 11. API Gateway (HTTP 8000, Debug 5000)
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
      args:
        SERVICE_NAME: api-gateway
        SERVICE_PORT: 8000
        DEBUG_PORT: 5000
    image: vishop/api-gateway:dev
    container_name: vishop-dev-api-gateway
    restart: on-failure
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
      - "${GATEWAY_DEBUG_PORT:-5000}:5000"
    environment:
      SERVER_PORT: 8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 bytes}
      SPRING_PROFILES_ACTIVE: dev
      IAM_SERVICE_URL: http://iam-service:8080
      AUDIT_SERVICE_URL: http://audit-service:8082
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: 1.0
    depends_on:
      - audit-service

volumes:
  postgres-dev-data:
  kafka-dev-data:
  redis-dev-data:
  prometheus-dev-data:
  loki-dev-data:
  grafana-dev-data:

networks:
  default:
    name: vishop-dev-network
