# =============================================================================
# ViShop Platform - Docker Compose for PRODUCTION
# =============================================================================
# Security & Operational Highlights:
# - Minimal attack surface: ONLY API Gateway (8000) and Grafana (3000) are mapped to host
# - Internal DB, Kafka, Redis & microservices communicate strictly inside container network
# - Strict CPU and Memory limits (prevent memory leak from bringing down host)
# - Log rotation configured (max 50MB per file, max 5 files) to prevent disk exhaustion
# - Non-root execution with hardened Alpine JRE 21 runtime
# =============================================================================

x-logging: &prod-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 (Internal network only - No host port exposure)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vishop-prod-postgres
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vishop_platform}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ../postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-vishop_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *prod-logging

  # ---------------------------------------------------------------------------
  # 2. Apache Kafka (KRaft mode - Internal network only)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: vishop-prod-kafka
    restart: always
    expose:
      - "9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-prod-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 1024M
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *prod-logging

  # ---------------------------------------------------------------------------
  # 3. Redis 7 (Internal network only)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vishop-prod-redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-prod-data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *prod-logging

  # ---------------------------------------------------------------------------
  # 4. Observability Stack (Jaeger, Prometheus, Loki, Grafana)
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: vishop-prod-jaeger
    restart: always
    expose:
      - "4317"
      - "4318"
      - "16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging: *prod-logging

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: vishop-prod-prometheus
    restart: always
    expose:
      - "9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-prod-data:/prometheus
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging: *prod-logging

  loki:
    image: grafana/loki:3.0.0
    container_name: vishop-prod-loki
    restart: always
    expose:
      - "3100"
    volumes:
      - ../loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-prod-data:/loki
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging: *prod-logging

  grafana:
    image: grafana/grafana:10.4.1
    container_name: vishop-prod-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-prod-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
      - loki
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *prod-logging

  # ===========================================================================
  # PRODUCTION MICROSERVICES
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 5. IAM Service
  # ---------------------------------------------------------------------------
  iam-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.prod
      args:
        SERVICE_NAME: iam-service
        SERVICE_PORT: 8080
    image: vishop/iam-service:prod
    container_name: vishop-prod-iam-service
    restart: always
    expose:
      - "8080"
    environment:
      SERVER_PORT: 8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 bytes}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vishop_iam
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *prod-logging

  # ---------------------------------------------------------------------------
  # 6. Tenant Service
  # ---------------------------------------------------------------------------
  audit-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.prod
      args:
        SERVICE_NAME: audit-service
        SERVICE_PORT: 8082
    image: vishop/audit-service:prod
    container_name: vishop-prod-audit-service
    restart: always
    expose:
      - "8082"
    environment:
      SERVER_PORT: 8082
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 bytes}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vishop_audit
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.2"
          memory: 384M
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *prod-logging

  subscription-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.prod
      args:
        SERVICE_NAME: subscription-service
        SERVICE_PORT: 8083
    image: vishop/subscription-service:prod
    container_name: vishop-prod-subscription-service
    restart: always
    expose:
      - "8083"
    environment:
      SERVER_PORT: 8083
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 bytes}
      SEPAY_ENABLED: ${SEPAY_ENABLED:-false}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      SEPAY_BANK: ${SEPAY_BANK:-}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER:-}
      SEPAY_ACCOUNT_HOLDER: ${SEPAY_ACCOUNT_HOLDER:-}
      SEPAY_QR_ACCOUNT_NUMBER: ${SEPAY_QR_ACCOUNT_NUMBER:-}
      SEPAY_SUB_ACCOUNT: ${SEPAY_SUB_ACCOUNT:-}
      SEPAY_MEMO_PREFIX: ${SEPAY_MEMO_PREFIX:-}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vishop_billing
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.2"
          memory: 384M
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *prod-logging

  # ---------------------------------------------------------------------------
  # 8. API Gateway (Public Ingress Entrypoint on Host Port 8000)
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.prod
      args:
        SERVICE_NAME: api-gateway
        SERVICE_PORT: 8000
    image: vishop/api-gateway:prod
    container_name: vishop-prod-api-gateway
    restart: always
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      SERVER_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 bytes}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      SPRING_PROFILES_ACTIVE: prod
      IAM_SERVICE_URL: http://iam-service:8080
      AUDIT_SERVICE_URL: http://audit-service:8082
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8083
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 512M
    depends_on:
      - audit-service
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *prod-logging

volumes:
  postgres-prod-data:
  kafka-prod-data:
  redis-prod-data:
  prometheus-prod-data:
  loki-prod-data:
  grafana-prod-data:

networks:
  default:
    name: vishop-prod-network
